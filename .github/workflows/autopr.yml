name: AutoPR
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  autopr:
    runs-on: ubuntu-latest
    steps:
      - uses: patchwork-eng/autopr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          openai_key: ${{ secrets.OPENAI_KEY }}